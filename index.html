<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active by Laisha — Track & Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #f0f0ef;
    --surface: #ffffff;
    --surface-2: #f4f4f3;
    --surface-3: #e9e9e8;
    --line: #111111;
    --line-soft: #dcdcda;
    --text: #111111;
    --text-dim: #8a8a8e;
    --text-dim-2: #b3b3b0;
    --accent: #ff3b30;
    --accent-soft: #ffe3e0;
    --ok: #2fae52;
    --ok-soft: #e2f5e7;
    --font: ui-rounded, 'SF Pro Rounded', 'Nunito', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;padding:0 0 110px 0;}

  /* TOP HEADER */
  .top-header{
    padding:22px 18px 10px 18px;
    display:flex;align-items:flex-start;justify-content:space-between;
  }
  .top-title{font-weight:900;font-size:30px;letter-spacing:-0.6px;}
  .top-sub{color:var(--text-dim);font-size:14px;margin-top:2px;font-weight:600;}
  .top-icons{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--text);cursor:pointer;position:relative;
  }
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;background:var(--surface-3);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  .avatar-btn.active{background:var(--text);color:#fff;}

  .view{padding:16px 16px;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

  h2.section-title{font-weight:900;letter-spacing:-0.4px;font-size:24px;margin:0 0 3px 0;}
  .eyebrow{font-size:12px;letter-spacing:.4px;color:var(--accent);text-transform:uppercase;font-weight:800;margin-bottom:5px;}
  .sub{color:var(--text-dim);font-size:13.5px;margin:0 0 18px 0;line-height:1.5;font-weight:600;}

  .card{
    background:var(--surface);border:1.5px solid var(--line);border-radius:22px;
    padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(17,17,17,0.06);
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  label{display:block;font-size:11.5px;letter-spacing:.3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;font-weight:800;}
  input[type=text],input[type=number],input[type=file],select{
    width:100%;background:var(--surface-2);border:1.5px solid var(--line-soft);color:var(--text);
    padding:11px 12px;border-radius:14px;font-family:var(--font);font-size:15px;margin-bottom:12px;font-weight:700;
  }
  input:focus,select:focus{outline:none;border-color:var(--text);}
  .choice-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .choice{
    padding:8px 14px;border:1.5px solid var(--line-soft);border-radius:18px;
    font-size:13px;color:var(--text-dim);cursor:pointer;user-select:none;background:var(--surface-2);transition:all .15s;font-weight:700;
  }
  .choice.selected{background:var(--text);border-color:var(--text);color:#fff;}

  button.primary{
    background:var(--text);color:#fff;border:none;padding:15px 22px;border-radius:16px;
    font-weight:800;letter-spacing:.2px;font-size:15px;cursor:pointer;width:100%;transition:opacity .15s;font-family:var(--font);
  }
  button.primary:hover{opacity:.85;}
  button.ghost{
    background:var(--surface-2);border:1.5px solid var(--line-soft);color:var(--text);
    padding:10px 16px;border-radius:14px;cursor:pointer;font-size:13px;font-family:var(--font);font-weight:800;
  }
  button.ghost:hover{border-color:var(--text);}

  /* BOTTOM NAV */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;z-index:20;pointer-events:none;
  }
  .bottom-nav-inner{
    pointer-events:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:30px;
    display:flex;gap:4px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08);
  }
  .nav-btn{
    width:52px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;
  }
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn.active{background:var(--text);color:#fff;}

  /* HERO / TODAY CARD */
  .hero-card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 4px 14px rgba(17,17,17,0.06);}
  .hero-greeting{font-size:21px;font-weight:900;letter-spacing:-0.4px;}
  .hero-date{color:var(--text-dim);font-size:13px;margin-top:2px;margin-bottom:16px;font-weight:700;text-transform:capitalize;}
  .hero-workout{
    background:var(--surface-2);border:1.5px solid var(--line-soft);border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;
  }
  .hero-workout-label{font-weight:800;font-size:16px;}
  .hero-workout-meta{color:var(--text-dim);font-size:12px;margin-top:3px;font-weight:700;}
  .hero-ring{position:relative;width:56px;height:56px;flex-shrink:0;}
  .hero-ring svg{transform:rotate(-90deg);}
  .hero-ring-bg{fill:none;stroke:var(--surface-3);stroke-width:5;}
  .hero-ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
  .hero-ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;}

  /* CALENDAR (week strip) */
  .streak-card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(17,17,17,0.06);}
  .streak-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .streak-title{font-size:12.5px;color:var(--text-dim);font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
  .streak-count{font-size:13px;font-weight:800;color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-wd{text-align:center;font-size:10.5px;font-weight:800;color:var(--text-dim-2);text-transform:uppercase;padding-bottom:2px;}
  .cal-day{
    aspect-ratio:1;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);font-weight:800;
  }
  .cal-day.done{background:var(--text);border-color:var(--text);color:#fff;}
  .cal-day.today{border-color:var(--accent);}
  .cal-day.today.done{background:var(--accent);border-color:var(--accent);}

  /* LIFT CARD */
  .lift-card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(17,17,17,0.06);}
  .lift-card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;justify-content:space-between;}
  .lift-name{font-weight:800;font-size:14.5px;}
  .lift-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;text-transform:capitalize;font-weight:700;}
  .remove-exercise{font-size:11.5px;color:var(--accent);font-weight:800;cursor:pointer;flex-shrink:0;}

  .set-table{display:flex;flex-direction:column;gap:6px;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:8px;align-items:center;}
  .set-row-head{color:var(--text-dim-2);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:0 2px;}
  .set-num{
    width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text-dim);
  }
  .set-input{
    background:var(--surface-2);border:1.5px solid var(--line-soft);color:var(--text);
    padding:8px 8px;border-radius:10px;font-size:14px;font-family:var(--font);width:100%;text-align:center;font-weight:800;margin-bottom:0;
  }
  .set-check{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-soft);
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:13px;font-weight:800;transition:all .15s;justify-self:center;background:var(--surface-2);
  }
  .set-check.done{background:var(--ok);border-color:var(--ok);color:#fff;}
  .add-set{
    margin-top:4px;text-align:center;padding:10px;border:1.5px dashed var(--line-soft);border-radius:12px;
    color:var(--text-dim);font-size:12.5px;font-weight:800;cursor:pointer;
  }
  .add-set:hover{border-color:var(--text);color:var(--text);}
  .add-exercise-btn{
    text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:18px;
    color:var(--text);font-size:13.5px;font-weight:800;cursor:pointer;margin-bottom:14px;background:var(--surface);
  }
  .add-exercise-btn:hover{background:var(--surface-2);}

  /* THUMBNAILS (crossfade "gif") */
  .ex-thumb{position:relative;overflow:hidden;flex-shrink:0;background:var(--surface-3);width:38px;height:38px;border-radius:12px;}
  .ex-thumb.lg{width:48px;height:48px;border-radius:14px;}
  .ex-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  img.frame-a{animation:frameA 2.4s ease-in-out infinite;}
  img.frame-b{animation:frameB 2.4s ease-in-out infinite;}
  @keyframes frameA{0%,40%{opacity:1;}50%,90%{opacity:0;}100%{opacity:1;}}
  @keyframes frameB{0%,40%{opacity:0;}50%,90%{opacity:1;}100%{opacity:0;}}

  /* WEEK PLAN (rutina) */
  .week-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .day-cell{
    background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
    padding:12px 6px;text-align:center;cursor:pointer;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .day-cell.today{border-color:var(--accent);background:var(--accent-soft);}
  .day-name{font-size:10px;letter-spacing:.5px;color:var(--text-dim);text-transform:uppercase;font-weight:800;}
  .day-split{font-size:12.5px;font-weight:800;margin-top:6px;line-height:1.25;}
  .day-tag{font-size:10px;color:var(--text-dim);margin-top:4px;font-weight:700;}

  .exercise-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);gap:12px;cursor:pointer;}
  .exercise-row:last-child{border-bottom:none;}
  .ex-name{font-weight:800;font-size:14px;}
  .ex-meta{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-weight:700;}

  /* REST TIMER */
  .timer-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 2px 0;}
  .plate-timer{position:relative;width:160px;height:160px;}
  .plate-timer svg.ring-svg{transform:rotate(-90deg);}
  .plate-timer .ring-bg{fill:none;stroke:var(--surface-2);stroke-width:9;}
  .plate-timer .ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear;}
  .plate-timer .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .plate-timer .t-num{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;}
  .plate-timer .t-label{font-size:10px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-top:2px;font-weight:800;}
  .timer-controls{display:flex;gap:10px;}

  /* WORKOUT MODAL (builder tipo "Untitled Workout") */
  .workout-card{padding-bottom:24px;}
  .workout-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .workout-head .modal-title{font-size:24px;}
  .workout-stats-row{display:flex;align-items:center;justify-content:center;gap:24px;padding:6px 0 4px 0;}
  .workout-stat{text-align:center;}
  .workout-stat-num{font-size:26px;font-weight:900;letter-spacing:-0.5px;}
  .workout-stat-label{font-size:11.5px;color:var(--text-dim);font-weight:800;margin-top:2px;}
  .workout-stat-divider{width:1.5px;height:34px;background:var(--line-soft);}
  .workout-ex-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .workout-ex-row:last-of-type{border-bottom:none;}

  /* PROGRESS */
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:100px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;}
  .stat-num{font-size:24px;font-weight:900;letter-spacing:-0.5px;}
  .stat-label{font-size:10.5px;color:var(--text-dim);letter-spacing:.3px;text-transform:uppercase;margin-top:4px;font-weight:800;}
  canvas{width:100%;display:block;}

  .empty{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:13.5px;font-weight:700;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line-soft);}
  th{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;font-weight:800;}
  .pr-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:900;padding:2px 8px;border-radius:20px;}

  /* MODAL (exercise demo + catalog) */
  .modal-overlay{position:fixed;inset:0;background:rgba(17,17,17,0.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal-card{
    background:var(--surface);border:1.5px solid var(--line);border-top-left-radius:26px;border-top-right-radius:26px;
    width:100%;max-width:520px;padding:16px;max-height:88vh;overflow-y:auto;animation:modalUp .2s ease;
  }
  @keyframes modalUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-thumb{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--surface-2);margin-bottom:14px;border:1.5px solid var(--line-soft);}
  .modal-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .modal-title{font-size:19px;font-weight:900;letter-spacing:-0.3px;}
  .modal-sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;text-transform:capitalize;font-weight:700;}

  .catalog-card{padding-bottom:24px;}
  .catalog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .search-pill{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1.5px solid var(--line-soft);
    border-radius:20px;padding:10px 14px;margin-bottom:12px;
  }
  .search-pill input{border:none;background:transparent;padding:0;margin:0;font-size:14px;width:100%;font-weight:700;}
  .search-pill input:focus{outline:none;}
  .search-pill svg{flex-shrink:0;color:var(--text-dim);}
  .segment-tabs{display:flex;gap:16px;overflow-x:auto;margin-bottom:14px;padding-bottom:8px;border-bottom:1.5px solid var(--line-soft);}
  .segment-tab{
    flex-shrink:0;font-size:13.5px;font-weight:700;color:var(--text-dim);cursor:pointer;padding-bottom:8px;
    border-bottom:2px solid transparent;margin-bottom:-9.5px;white-space:nowrap;
  }
  .segment-tab.active{color:var(--text);font-weight:900;border-bottom-color:var(--text);}
  .catalog-list{display:flex;flex-direction:column;}
  .catalog-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .catalog-row:last-child{border-bottom:none;}
  .catalog-add{
    width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text);font-weight:900;font-size:16px;
  }
  .segment-tabs.equip-tabs{gap:10px;margin-bottom:12px;}
  .segment-tabs.equip-tabs .segment-tab{
    background:var(--surface-2);border:1.5px solid var(--line-soft);border-radius:16px;padding:6px 12px;margin-bottom:0;
  }
  .segment-tabs.equip-tabs .segment-tab.active{background:var(--text);color:#fff;border-color:var(--text);}
  .group-row .catalog-add{background:var(--text);color:#fff;border-color:var(--text);font-size:18px;}

  /* EQUIP PICKER (elegir equipo) */
  .equip-card .modal-thumb{margin-top:2px;}
  .equip-list{display:flex;flex-direction:column;}
  .equip-row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .equip-row:last-child{border-bottom:none;}
  .equip-row-label{font-weight:800;font-size:15px;}
  .equip-radio{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-soft);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:transparent;font-weight:800;font-size:13px;flex-shrink:0;
  }
  .equip-radio.selected{background:var(--ok);border-color:var(--ok);color:#fff;}

  /* COMUNIDAD */
  .community-grid{display:flex;flex-direction:column;gap:14px;}
  .community-post{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;}
  .community-post img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover;}
  .community-post-body{padding:12px 14px;}
  .community-post-meta{font-size:11px;color:var(--text-dim);font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
  .community-post-caption{font-size:13.5px;margin-top:5px;font-weight:600;}

  /* AUTH / PAYWALL */
  .full-screen-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;}
  .auth-brand{font-weight:900;font-size:19px;letter-spacing:-0.3px;margin-bottom:6px;}
  .auth-brand span{color:var(--accent);}
  .auth-error{color:var(--accent);font-size:12.5px;font-weight:700;margin-bottom:10px;}
  .price-tag{font-size:42px;font-weight:900;letter-spacing:-1px;margin:14px 0 2px;}
  .price-tag span{font-size:15px;color:var(--text-dim);font-weight:700;}
  .account-card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(17,17,17,0.06);}
  .account-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .account-row-label{font-size:12px;color:var(--text-dim);font-weight:800;text-transform:uppercase;}
  .status-pill{font-size:11px;font-weight:900;padding:3px 10px;border-radius:12px;}
  .status-pill.active{background:var(--ok-soft);color:var(--ok);}
  .status-pill.inactive{background:var(--accent-soft);color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ ICONOS ============ */
const ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>`,
  calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18"/><path d="M8 3v4M16 3v4"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>`,

function pickExercises(musculo, equipoDisponible, cantidad){
  const pool = (EJ[musculo]||[]).filter(e => e.eq.some(eq => equipoDisponible.includes(eq)));
  const base = pool.length ? pool : (EJ[musculo]||[]);
  return base.slice(0, Math.max(1,cantidad));
}

/* Ajuste por edad: volumen y descansos (peso/estatura ya se usan en IMC/kcal) */
function edadFactor(edad){
  if(edad >= 45) return { extraDelta:-1, restMultiplier:1.25, tag:'Plan ajustado para tu edad (45+): más descanso, volumen moderado.' };
  if(edad >= 30) return { extraDelta:0, restMultiplier:1.1, tag:null };
  return { extraDelta:0, restMultiplier:1, tag:null };
}
function scaleRestString(str, mult){
  if(mult === 1) return str;
  return String(str).replace(/\d+/g, n => String(Math.max(10, Math.round(parseInt(n)*mult/5)*5)));
}

function generarRutina(profile){
  const dias = SPLITS[profile.diasSemana] || SPLITS[3];
  const params = GOAL_PARAMS[profile.objetivo];
  const edadInfo = edadFactor(profile.edad);
  const extra = Math.max(0, (LEVEL_EXTRA[profile.nivel] ?? 0) + edadInfo.extraDelta);
  const descansoSerie = scaleRestString(params.descansoSerie, edadInfo.restMultiplier);
  const descansoEjercicio = scaleRestString(params.descansoEjercicio, edadInfo.restMultiplier);
  const semana = dias.map(([key, label], idx) => {
    const musculos = DAY_MUSCLES[key];
    let ejercicios = [];
    musculos.forEach((m,i) => {
      const cantidad = params.nEjPorMusculo + (i < 2 ? extra : 0);
      const picked = pickExercises(m, profile.equipo, cantidad);
      picked.forEach(p => ejercicios.push({
        musculo: m, nombre: p.n, mediaId: EXERCISE_MEDIA[p.n] || null, series: params.series, reps: params.reps,
        descansoSerie, descansoEjercicio
      }));
    });
    return { key, label, ejercicios };
  });
  return { objetivo: profile.objetivo, generadaEl: new Date().toISOString(), dias: semana, ajusteEdad: edadInfo.tag };
}

function parseSeriesCount(str){
  const m = String(str).match(/\d+/);
  return m ? parseInt(m[0]) : 3;
}

/* ============ CÁLCULOS DE PERFIL ============ */
function calcularIMC(pesoKg, estaturaCm){
  const h = estaturaCm/100;
  return pesoKg / (h*h);
}
function categoriaIMC(imc){
  if(imc < 18.5) return 'Bajo peso';
  if(imc < 25) return 'Normal';
  if(imc < 30) return 'Sobrepeso';
  return 'Obesidad';
}
function calcularTDEE(profile){
  const {pesoKg, estaturaCm, edad, sexo, diasSemana} = profile;
  let tmb;
  const male = 10*pesoKg + 6.25*estaturaCm - 5*edad + 5;
  const female = 10*pesoKg + 6.25*estaturaCm - 5*edad - 161;
  if(sexo === 'hombre') tmb = male;
  else if(sexo === 'mujer') tmb = female;
  else tmb = (male+female)/2;
  const factorActividad = diasSemana <= 2 ? 1.375 : diasSemana <= 4 ? 1.55 : diasSemana <= 5 ? 1.65 : 1.75;
  const tdee = tmb * factorActividad;
  let objetivoCals = tdee;
  if(profile.objetivo === 'perdida_grasa') objetivoCals = tdee * 0.82;
  if(profile.objetivo === 'fuerza' || profile.objetivo === 'hipertrofia') objetivoCals = tdee * 1.08;
  return { tdee: Math.round(tdee), objetivoCals: Math.round(objetivoCals) };
}

  { nombre:'Crunch abdominal', musculo:'core', variantes:{ cable:'Cable_Crunch', peso_corporal:'Crunches' } },
];
function classifyExercise(ex){
  if(ex.category === 'cardio') return 'cardio';
  if(ex.category === 'olympic weightlifting') return 'olimpico';
  const pm = ex.primaryMuscles || [];
  if(pm.includes('chest')) return 'pecho';
  if(pm.some(m=>['back','lats','middle back','lower back','traps'].includes(m))) return 'espalda';
  if(pm.includes('shoulders')) return 'hombro';
  if(pm.some(m=>['biceps','triceps','forearms'].includes(m))) return 'brazo';
  if(pm.includes('glutes')) return 'gluteo';
  if(pm.some(m=>['quadriceps','hamstrings','calves','adductors','abductors'].includes(m))) return 'pierna';
  if(pm.includes('abdominals') || pm.includes('neck')) return 'core';
  return 'otros';
}
async function loadCatalog(){
  if(State.catalog) return State.catalog;
  try{
    const res = await fetch(CATALOG_URL);
    const data = await res.json();
    State.catalog = data.filter(d => d.images && d.images.length >= 2).map(d => ({
      id: d.id, name: d.name, category: classifyExercise(d), equipment: d.equipment,
    }));
  }catch(e){ console.error('catalog fetch error', e); State.catalog = []; }
  return State.catalog;
}
function mediaUrlsById(id){
  if(!id) return null;
  return [MEDIA_BASE+id+'/0.jpg', MEDIA_BASE+id+'/1.jpg'];
}
function thumbHTML(mediaId, altNombre, sizeClass){
  const urls = mediaUrlsById(mediaId);

  return `<div class="${cls}"><img class="frame-a" src="${urls[0]}" loading="lazy" alt=""><img class="frame-b" src="${urls[1]}" loading="lazy" alt=""></div>`;
}

async function addExtraExercise(ex){
  const fechaKey = new Date().toISOString().slice(0,10);
  if(!State.progress.hoy[fechaKey]) State.progress.hoy[fechaKey] = { sets:{}, extra:[] };
  if(!State.progress.hoy[fechaKey].extra) State.progress.hoy[fechaKey].extra = [];
  State.progress.hoy[fechaKey].extra.push({
    nombre: ex.name, musculo: CATEGORY_LABELS[ex.category], mediaId: ex.id, reps: '8-12',
    sets: [{lbs:'',reps:'',done:false},{lbs:'',reps:'',done:false},{lbs:'',reps:'',done:false}]
  });
  await saveKey('progreso', State.progress);
}

/* --- HOY (hero + calendario semanal + sets por ejercicio + agregar ejercicio) --- */
function getHoyData(){
  const r = State.routine;
  const hoyIdx = new Date().getDay();
  const idxEnRutina = Math.min(hoyIdx===0?6:hoyIdx-1, r.dias.length-1);
  const dia = r.dias[idxEnRutina];
  const fechaKey = new Date().toISOString().slice(0,10);
  if(!State.progress.hoy[fechaKey]) State.progress.hoy[fechaKey] = { sets:{}, extra:[] };
  const registro = State.progress.hoy[fechaKey];
  if(!registro.extra) registro.extra = [];
  dia.ejercicios.forEach((ej,i) => {
    if(!registro.sets[i]){
      const n = parseSeriesCount(ej.series);
      registro.sets[i] = Array.from({length:n}, () => ({lbs:'', reps:'', done:false}));
    }
  });
  const combined = [
    ...dia.ejercicios.map((ej,i)=>({nombre:ej.nombre, musculo:ej.musculo, mediaId:ej.mediaId, reps:ej.reps, kind:'plan', idx:i, sets: registro.sets[i]})),
    ...registro.extra.map((ej,i)=>({nombre:ej.nombre, musculo:ej.musculo, mediaId:ej.mediaId, reps:ej.reps, kind:'extra', idx:i, sets: ej.sets})),
  ];
  return { dia, fechaKey, registro, combined };
}

/* --- HOY (hub limpio: hero + calendario) --- */
function renderHoy(view){
  const { dia, fechaKey, combined } = getHoyData();
  const totalSets = combined.reduce((acc,it)=>acc+it.sets.length,0);
  const doneSets = combined.reduce((acc,it)=>acc+it.sets.filter(s=>s.done).length,0);
  const pct = totalSets ? Math.round((doneSets/totalSets)*100) : 0;
  const completadoHoy = !!State.progress.entrenamientosCompletados[fechaKey];
  const RING_CIRC = 138.2;
  const ringOffset = RING_CIRC - (Math.min(pct,100)/100)*RING_CIRC;

  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay());
  const weekDays = [];
  for(let i=0;i<7;i++){
    const dt = new Date(weekStart);
    dt.setDate(weekStart.getDate()+i);
    const key = dt.toISOString().slice(0,10);
    weekDays.push({ key, num: dt.getDate(), isToday: key===fechaKey, done: !!State.progress.entrenamientosCompletados[key] });
  }
  const rachaDias = Object.keys(State.progress.entrenamientosCompletados).length;
  const WD = ['D','L','M','M','J','V','S'];

  view.innerHTML = `
    <div class="hero-card">
      <div class="hero-greeting">Hola, ${State.profile.nombre}</div>
      <div class="hero-date">${today.toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long'})}</div>
      <div class="hero-workout" id="hero-workout-jump">
        <div class="hero-ring">
          <svg width="56" height="56" viewBox="0 0 56 56">
            <circle class="hero-ring-bg" cx="28" cy="28" r="22"></circle>
            <circle class="hero-ring-fg" cx="28" cy="28" r="22" stroke-dasharray="${RING_CIRC}" stroke-dashoffset="${ringOffset}"></circle>
          </svg>
          <div class="hero-ring-pct">${completadoHoy ? '✓' : pct+'%'}</div>
        </div>
        <div style="flex:1;">
          <div class="hero-workout-label">${dia.label}</div>
          <div class="hero-workout-meta">${totalSets} sets · ${combined.length} ejercicios</div>
        </div>
      </div>
      <button class="primary" id="btn-empezar-entreno" style="margin-top:14px;">
        ${completadoHoy ? '✓ Entrenamiento completado' : (doneSets>0 ? 'Continuar entrenamiento' : 'Empezar entrenamiento')}
      </button>
    </div>

    <div class="streak-card">
      <div class="streak-head">
        <div class="streak-title">Esta semana</div>
        <div class="streak-count">🔥 ${rachaDias} días activos</div>
      </div>
      <div class="cal-grid">
        ${WD.map(d=>`<div class="cal-wd">${d}</div>`).join('')}
        ${weekDays.map(d=>`<div class="cal-day ${d.done?'done':''} ${d.isToday?'today':''}">${d.num}</div>`).join('')}
      </div>
    </div>
  `;

  document.getElementById('hero-workout-jump').onclick = () => openWorkoutModal();
  document.getElementById('btn-empezar-entreno').onclick = () => openWorkoutModal();
}

/* --- MODAL DE ENTRENAMIENTO (armar → registrar) --- */
function openWorkoutModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-card workout-card" id="workout-card"></div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  let mode = 'build';

  function closeModal(){
    if(State.ui.timer){ clearInterval(State.ui.timer); State.ui.timer = null; }
    overlay.remove();
    render();
  }

  function renderLiftCard(it){
    return `
      <div class="lift-card">
        <div class="lift-card-head">
          <div class="js-open-modal" style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;" data-nombre="${it.nombre}" data-musculo="${it.musculo}" data-media="${it.mediaId||''}">
            ${thumbHTML(it.mediaId, it.nombre)}
            <div>
              <div class="lift-name">${it.nombre}</div>
              <div class="lift-sub">${it.musculo} · objetivo ${it.reps} reps</div>
            </div>
          </div>
          ${it.kind==='extra' ? `<div class="remove-exercise" data-ex="${it.idx}">Quitar</div>` : ''}
        </div>
        <div class="set-table">
          <div class="set-row set-row-head"><span>SET</span><span>LBS</span><span>REPS</span><span></span></div>
          ${it.sets.map((s,si)=>`
            <div class="set-row">
              <div class="set-num">${si+1}</div>
              <input type="number" class="set-input f-lbs" data-kind="${it.kind}" data-ex="${it.idx}" data-set="${si}" value="${s.lbs}" placeholder="0">
              <input type="number" class="set-input f-reps" data-kind="${it.kind}" data-ex="${it.idx}" data-set="${si}" value="${s.reps}" placeholder="0">
              <div class="set-check ${s.done?'done':''} f-check" data-kind="${it.kind}" data-ex="${it.idx}" data-set="${si}">✓</div>
            </div>
          `).join('')}
          <div class="add-set" data-kind="${it.kind}" data-ex="${it.idx}">+ Añadir set</div>
        </div>
      </div>
    `;
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.value = 0.2;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.35);
    }catch(e){}
  }

  function setupTimer(totalSeg){
    if(State.ui.timer) clearInterval(State.ui.timer);
    let restante = totalSeg;
    const ring = document.getElementById('ring-fg');
    const CIRC = 439.8;
    updateDisplay(restante, totalSeg);
    document.getElementById('btn-timer-start').onclick = () => {
      if(State.ui.timer) return;
      State.ui.timer = setInterval(() => {
        restante -= 1;
        if(restante <= 0){
          clearInterval(State.ui.timer);
          State.ui.timer = null;
          restante = 0;
          beep();
        }
        updateDisplay(restante, totalSeg);
      }, 1000);
    };
    document.getElementById('btn-timer-reset').onclick = () => {
      if(State.ui.timer){ clearInterval(State.ui.timer); State.ui.timer = null; }
      restante = totalSeg;
      updateDisplay(restante, totalSeg);
    };
    function updateDisplay(seg, total){
      const mm = String(Math.floor(seg/60)).padStart(2,'0');
      const ss = String(seg%60).padStart(2,'0');
      document.getElementById('t-num').textContent = `${mm}:${ss}`;
      const offset = CIRC * (seg/total);
      ring.setAttribute('stroke-dashoffset', offset);
    }
  }

  function renderCard(){
    const { dia, fechaKey, registro, combined } = getHoyData();
    const totalSets = combined.reduce((a,it)=>a+it.sets.length,0);
    const doneSets = combined.reduce((a,it)=>a+it.sets.filter(s=>s.done).length,0);
    const card = document.getElementById('workout-card');
    if(!card) return;

    function getSetsArr(kind, idx){
      return kind === 'extra' ? registro.extra[idx].sets : registro.sets[idx];
    }
    function bindRemove(scope){
      scope.querySelectorAll('.remove-exercise').forEach(el=>{
        el.onclick = async (e) => {
          e.stopPropagation();
          registro.extra.splice(parseInt(el.dataset.ex), 1);
          await saveKey('progreso', State.progress);
          renderCard();
        };
      });
    }

    if(mode === 'build'){
      card.innerHTML = `
        <div class="workout-head">
          <div class="modal-title">${dia.label}</div>
          <div class="icon-btn" id="wm-close">${ICONS.close}</div>
        </div>
        <div class="workout-stats-row">
          <div class="workout-stat"><div class="workout-stat-num">${totalSets}</div><div class="workout-stat-label">sets</div></div>
          <div class="workout-stat-divider"></div>
          <div class="workout-stat"><div class="workout-stat-num">${combined.length}</div><div class="workout-stat-label">ejercicios</div></div>
        </div>
        <div class="eyebrow" style="margin-top:18px;">Ejercicios</div>
        ${combined.length ? combined.map(it=>`
          <div class="workout-ex-row">
            <div class="js-open-modal" style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;" data-nombre="${it.nombre}" data-musculo="${it.musculo}" data-media="${it.mediaId||''}">
              ${thumbHTML(it.mediaId, it.nombre)}
              <div>
                <div class="lift-name">${it.nombre}</div>
                <div class="lift-sub">${it.sets.length} sets · ${it.reps} reps</div>
              </div>
            </div>
            ${it.kind==='extra' ? `<div class="remove-exercise" data-ex="${it.idx}">Quitar</div>` : ''}
          </div>
        `).join('') : `<div class="empty">Agrega ejercicios para armar tu entrenamiento.</div>`}
        <div class="add-exercise-btn" id="wm-add-exercise">+ Agregar ejercicio</div>
        <button class="primary" id="wm-start" style="margin-top:16px;">Empezar entrenamiento</button>
      `;
      bindExerciseModals(card);
      bindRemove(card);
      document.getElementById('wm-close').onclick = closeModal;
      document.getElementById('wm-add-exercise').onclick = () => openCatalogModal(renderCard);
      document.getElementById('wm-start').onclick = () => { mode = 'log'; renderCard(); };
    } else {
      card.innerHTML = `
        <div class="workout-head">
          <div class="modal-title">${dia.label}</div>
          <div class="icon-btn" id="wm-close">${ICONS.close}</div>
        </div>
        <div class="hero-workout-meta" style="margin-bottom:14px;">${totalSets} sets · ${combined.length} ejercicios · ${doneSets}/${totalSets} hechos</div>
        ${combined.map(renderLiftCard).join('')}
        <div class="add-exercise-btn" id="wm-add-exercise">+ Agregar ejercicio</div>
        <div class="card timer-wrap">
          <div class="eyebrow" style="align-self:flex-start;">Descanso entre series</div>
          <div class="plate-timer">
            <svg class="ring-svg" width="160" height="160" viewBox="0 0 160 160">
              <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
              <circle class="ring-fg" id="ring-fg" cx="80" cy="80" r="70" stroke-dasharray="439.8" stroke-dashoffset="439.8"></circle>
            </svg>
            <div class="center">
              <div class="t-num" id="t-num">00:00</div>
              <div class="t-label">segundos</div>
            </div>
          </div>
          <div class="choice-row" id="timer-presets">
            ${[30,60,90,120,180].map(s=>`<div class="choice" data-sec="${s}">${s}s</div>`).join('')}
          </div>
          <div class="timer-controls">
            <button class="ghost" id="btn-timer-start">Iniciar</button>
            <button class="ghost" id="btn-timer-reset">Reiniciar</button>
          </div>
        </div>
        <button class="primary" id="btn-completar-dia">Marcar entrenamiento de hoy como completado</button>
      `;
      bindExerciseModals(card);
      bindRemove(card);
      card.querySelectorAll('.f-lbs').forEach(el=>{
        el.onchange = async () => {
          getSetsArr(el.dataset.kind, el.dataset.ex)[el.dataset.set].lbs = el.value;
          await saveKey('progreso', State.progress);
        };
      });
      card.querySelectorAll('.f-reps').forEach(el=>{
        el.onchange = async () => {
          getSetsArr(el.dataset.kind, el.dataset.ex)[el.dataset.set].reps = el.value;
          await saveKey('progreso', State.progress);
        };
      });
      card.querySelectorAll('.f-check').forEach(el=>{
        el.onclick = async () => {
          const set = getSetsArr(el.dataset.kind, el.dataset.ex)[el.dataset.set];
          set.done = !set.done;
          await saveKey('progreso', State.progress);
          renderCard();
        };
      });
      card.querySelectorAll('.add-set').forEach(el=>{
        el.onclick = async () => {
          getSetsArr(el.dataset.kind, el.dataset.ex).push({lbs:'', reps:'', done:false});
          await saveKey('progreso', State.progress);
          renderCard();
        };
      });
      document.getElementById('wm-close').onclick = closeModal;
      document.getElementById('wm-add-exercise').onclick = () => openCatalogModal(renderCard);
      document.getElementById('btn-completar-dia').onclick = async () => {
        State.progress.entrenamientosCompletados[fechaKey] = true;
        await saveKey('progreso', State.progress);
        closeModal();
      };

      let segundosSeleccionados = 60;
      document.querySelectorAll('#timer-presets .choice').forEach(el=>{
        el.onclick = () => {
          document.querySelectorAll('#timer-presets .choice').forEach(c=>c.classList.remove('selected'));
          el.classList.add('selected');
          segundosSeleccionados = parseInt(el.dataset.sec);
          setupTimer(segundosSeleccionados);
        };
      });
      setupTimer(segundosSeleccionados);
    }
  }

  renderCard();
}

  const prog = State.progress;
  const p = State.profile;
  const tdee = calcularTDEE(p);
  const imc = calcularIMC(p.pesoKg, p.estaturaCm);
  const diasCompletados = Object.keys(prog.entrenamientosCompletados).length;

  view.innerHTML = `
    <div class="eyebrow">Panorama general</div>
    <h2 class="section-title">Tu progreso</h2>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${diasCompletados}</div><div class="stat-label">Entrenos</div></div>
      <div class="stat-box"><div class="stat-num">${imc.toFixed(1)}</div><div class="stat-label">IMC · ${categoriaIMC(imc)}</div></div>
      <div class="stat-box"><div class="stat-num">${tdee.objetivoCals}</div><div class="stat-label">Kcal/día meta</div></div>
    </div>
    <p class="sub" style="margin-top:10px;">Mantenimiento estimado: ${tdee.tdee} kcal/día. Cálculo aproximado (Mifflin-St Jeor).</p>

    <div class="card">
      <div class="eyebrow">Peso corporal</div>
      <div class="grid2" style="align-items:end;">
        <div><label>Registrar peso hoy (kg)</label><input type="number" id="f-peso-log" placeholder="Ej. 72.5"></div>
        <div><button class="primary" id="btn-log-peso">Guardar</button></div>
      </div>
      ${prog.pesoLog.length ? `<canvas id="chart-peso" height="150"></canvas>` : `<div class="empty">Aún no tienes registros de peso.</div>`}
    </div>

    <div class="card">
      <div class="eyebrow">Récords personales</div>
      <div class="grid2" style="align-items:end;">
        <div><label>Ejercicio</label><input type="text" id="f-pr-ej" placeholder="Ej. Press de banca"></div>
        <div><label>Peso × reps</label><input type="text" id="f-pr-val" placeholder="Ej. 80 × 5"></div>
      </div>
      <button class="ghost" id="btn-log-pr">Agregar PR</button>
      ${prog.prs.length ? `
        <table style="margin-top:14px;">
          <tr><th>Ejercicio</th><th>Marca</th><th>Fecha</th></tr>
          ${prog.prs.slice().reverse().map(pr=>`<tr><td>${escapeHtml(pr.ejercicio)}</td><td><span class="pr-tag">PR</span> ${escapeHtml(pr.valor)}</td><td>${new Date(pr.fecha).toLocaleDateString('es-MX')}</td></tr>`).join('')}
        </table>
      ` : `<div class="empty">Sin PRs registrados todavía.</div>`}
    </div>
  `;

  document.getElementById('btn-log-peso').onclick = async () => {
    const val = parseFloat(document.getElementById('f-peso-log').value);
    if(!val) return;
    prog.pesoLog.push({fecha: new Date().toISOString(), peso: val});
    await saveKey('progreso', prog);
    render();
  };
  document.getElementById('btn-log-pr').onclick = async () => {
    const ejercicio = document.getElementById('f-pr-ej').value.trim();
    const valor = document.getElementById('f-pr-val').value.trim();
    if(!ejercicio || !valor) return;
    prog.prs.push({ejercicio, valor, fecha: new Date().toISOString()});
    await saveKey('progreso', prog);
    render();
  };

  if(prog.pesoLog.length){
    drawLineChart('chart-peso', prog.pesoLog.map(l=>l.peso));
  }
}

function drawLineChart(canvasId, data){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 150;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max-min) || 1;
  const pad = 20;
  ctx.strokeStyle = '#ff3b30';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x = pad + (i/(Math.max(data.length-1,1))) * (w-pad*2);
    const y = h-pad - ((v-min)/range) * (h-pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = '#111111';
  data.forEach((v,i)=>{
    const x = pad + (i/(Math.max(data.length-1,1))) * (w-pad*2);
    const y = h-pad - ((v-min)/range) * (h-pad*2);
    ctx.beginPath(); ctx.arc(x,y,3.5,0,Math.PI*2); ctx.fill();
  });
}

/* --- COMUNIDAD (galería local de fotos) --- */
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function renderComunidad(view){
  const posts = (State.progress.community || []).slice().reverse();
  view.innerHTML = `
    <div class="eyebrow">Comparte tu progreso</div>
    <h2 class="section-title">Comunidad</h2>
    <p class="sub">Sube una foto al terminar tu entrenamiento. Se guarda en este dispositivo — es tu feed personal, no se comparte con otros usuarios.</p>
    <div class="card">
      <label>Foto de tu entrenamiento</label>
      <input type="file" accept="image/*" id="f-community-photo">
      <label>Comentario (opcional)</label>
      <input type="text" id="f-community-caption" placeholder="¿Cómo estuvo tu entreno?">
      <button class="primary" id="btn-community-post">Publicar</button>
    </div>
    ${posts.length ? `<div class="community-grid">${posts.map(p=>`
      <div class="community-post">
        <img src="${p.foto}" alt="">
        <div class="community-post-body">
          <div class="community-post-meta">${escapeHtml(p.dia || 'Entrenamiento')} · ${new Date(p.fecha).toLocaleDateString('es-MX')}</div>
          ${p.caption ? `<div class="community-post-caption">${escapeHtml(p.caption)}</div>` : ''}
        </div>
      </div>
    `).join('')}</div>` : `<div class="empty">Aún no compartes ninguna foto. ¡Sé el primero en tu comunidad!</div>`}
  `;

  document.getElementById('btn-community-post').onclick = async () => {
    const fileInput = document.getElementById('f-community-photo');
    const captionInput = document.getElementById('f-community-caption');
    const file = fileInput.files[0];
    if(!file) return;
    const dataUrl = await fileToDataUrl(file);
    if(!State.progress.community) State.progress.community = [];
    let diaLabel = '';
    if(State.routine){
      const hoyIdx = new Date().getDay();
      const idxEnRutina = Math.min(hoyIdx===0?6:hoyIdx-1, State.routine.dias.length-1);
      diaLabel = State.routine.dias[idxEnRutina].label;
    }
    State.progress.community.push({
      foto: dataUrl, caption: captionInput.value.trim(), fecha: new Date().toISOString(), dia: diaLabel
    });
    await saveKey('progreso', State.progress);
    render();
  };
}

/* ============ INICIO (con acceso por cuenta + suscripción) ============ */
async function bootApp(){
  if(!State.auth.user){
    renderAuthScreen();
    return;
  }

  State.profile = null;
  State.routine = null;
  State.progress = { pesoLog: [], entrenamientosCompletados: {}, prs: [], hoy: {}, community: [] };

  const params = new URLSearchParams(location.search);
  if(params.get('pago') === 'exito'){
    renderVerificandoPago();
    for(let i=0;i<6;i++){
      await checkSubscription();
      if(isSubscriptionActive()) break;
      await new Promise(r=>setTimeout(r,1500));
    }
    history.replaceState({}, '', location.pathname);
  } else {
    await checkSubscription();
  }

  if(!isSubscriptionActive()){
    renderPaywall();
    return;
  }

  await loadAll();
  render();
}

(function init(){
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'TOKEN_REFRESHED'){ State.auth.session = session; return; }
    State.auth.session = session;
    State.auth.user = session ? session.user : null;
    bootApp();
  });
})();
</script>
